id: backend-rbac-review
name: Backend RBAC Review
version: 0.1.0
category: code-review
visible_description: Review backend RBAC and public API payload boundaries.

input_modes:
  - current_file
  - selected_files
  - git_diff

input_schema:
  type: object
  required:
    - instruction
  properties:
    instruction:
      type: string
      maxLength: 4000
    files:
      type: array
      maxItems: 20
      items:
        type: object
        required: [path, content]
        properties:
          path:
            type: string
          content:
            type: string
            maxLength: 50000
    diff:
      type: string
      maxLength: 200000
    options:
      type: object
      additionalProperties: true

output_schema:
  type: object
  required:
    - summary
  properties:
    summary:
      type: string
    findings:
      type: array
    patch:
      type: string
    recommended_tests:
      type: array
      items:
        type: string
    artifacts:
      type: array
    safe_rationale:
      type: string

client_permissions:
  reads_workspace: true
  writes_workspace: optional
  runs_commands: optional
  sends_code_to_server: true

approval_policy:
  upload_context: user_confirm_large
  apply_patch: user_confirm
  run_commands: user_confirm

security:
  max_files: 20
  max_total_input_bytes: 300000
  deny_file_globs:
    - "**/.env"
    - "**/*.pem"
    - "**/*.key"
    - "**/id_rsa"
    - "**/credentials.json"
  allow_file_globs:
    - "**/*.py"
    - "**/*.ts"
    - "**/*.tsx"
    - "**/*.js"
    - "**/*.jsx"
    - "**/*.md"
    - "**/*.json"
    - "**/*.yaml"
    - "**/*.yml"

internal:
  skill_ref: backend-rbac-review
  runner: hermes
  model_policy: high_reasoning
  expose_skill_text: false
  policy:
    run_roles:
      - developer
