[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-gateway"
version = "0.1.0"
description = "FastAPI gateway for Skill-to-Capability."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
    "uvicorn[standard]>=0.29,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8,<9",
]

[project.scripts]
skillgw = "gateway.app.cli:main"

[tool.setuptools.packages.find]
include = ["gateway*"]
